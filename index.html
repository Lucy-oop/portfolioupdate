      rel="stylesheet"
    />

    <!--
      Set the theme class before first paint so a dark-mode visitor never sees a
      cream flash. Mirrors the logic in components/layout/ThemeToggle.tsx.
    -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('theme')
          var dark =
            stored === 'dark' ||
            (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
